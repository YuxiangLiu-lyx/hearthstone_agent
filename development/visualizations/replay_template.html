ize:10px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:80px;text-align:right}.buttons{display:flex;align-items:center;justify-content:space-between;gap:12px}.transport{display:flex;align-items:center;gap:7px}.play{background:var(--gold);color:#242124;border-color:var(--gold);font-weight:700;min-width:100px}.play:hover{background:#f6d99d}.step{padding:8px 12px}.control-right{display:flex;align-items:center;gap:11px;font-size:10px;color:var(--muted)}select{border:1px solid var(--line);background:#232c39;padding:6px;border-radius:6px;font-size:11px}.phase-toggle{display:flex;gap:0;background:#10151e;border-radius:6px;border:1px solid var(--line);overflow:hidden}.phase-toggle button{border:0;border-radius:0;padding:6px 8px;font-size:10px;background:transparent;color:var(--muted)}.phase-toggle button.chosen{background:#3b4554;color:var(--text)}footer{display:flex;align-items:center;justify-content:space-between;color:#7e889a;font-size:10px;padding:15px 2px 0;gap:10px}.link-button{background:transparent;border:0;font-size:10px;padding:0;color:#aebbd0}.selected-hero{box-shadow:inset 0 0 0 2px #ee9397}.view-badge{font-size:10px;letter-spacing:0;background:#242e3a;color:var(--muted);padding:3px 8px;border-radius:5px}.end-ribbon{position:absolute;right:20px;bottom:17px;padding:7px 13px;border:1px solid #8cd5b377;border-radius:7px;color:var(--green);background:#12251ff0;font-size:13px;box-shadow:0 5px 20px #0004;pointer-events:none;z-index:3}.defeat .end-ribbon{border-color:#ee939777;color:var(--red);background:#321c23f0}[hidden]{display:none!important}

<body>
<div class="shell">
<header class="top"><div class="brand">HEARTHSTONE <span>AGENT ARENA / MATCH REPLAY</span></div><nav class="tabs" aria-label="选择对局"><a href="index.html">回放首页</a><a href="victory.html" id="navWin">胜局</a><a href="defeat.html" id="navLoss">败局</a></nav></header>
<section class="heading"><div><p class="eyebrow">ZOO v7 · 真实对战记录</p><h1><span class="result-tag" id="resultTag"></span><span id="matchTitle"></span></h1><div class="sub" id="subtitle"></div></div><div class="meta"><div><b id="roundCount"></b><span>对局轮数</span></div><div><b id="actionCount"></b><span>完整动作</span></div><div class="optional"><b id="firstLabel"></b><span>动物园顺序</span></div></div></section>
<div class="layout">
<main class="main">
<div class="arena" aria-label="对战场面">
 <div class="hero-bar opponent" id="oppHero"></div>
 <div class="opponent-hand" id="opponentHand"></div>
 <div class="board" id="opponentBoard" aria-label="对方随从"></div>
 <div class="battle-strip"><span class="turn-label" id="turnLabel"></span><span class="view-badge" id="viewBadge">行动后</span><span class="active-label" id="activeLabel"></span></div>
 <div class="board" id="ownBoard" aria-label="我方随从"></div>
 <div class="hero-bar own" id="ownHero"></div>
 <div class="hand-section"><div class="hand-title"><span>我方手牌 · <span id="handCount"></span></span><span>鼠标悬停可查看卡牌说明</span></div><div class="hand" id="ownHand"></div></div>
 <div class="end-ribbon" id="endRibbon" hidden></div>
</div>
<div class="action-box" aria-live="polite"><span class="action-icon" id="actionIcon"></span><div><div class="action-text" id="actionText"></div><div class="action-sub" id="actionSub"></div></div></div>
<div class="controls">
 <div class="progress-row"><input type="range" id="seek" min="0" value="0" aria-label="回放进度"><span class="progress-label" id="progressLabel"></span></div>
 <div class="buttons"><div class="transport"><button class="step" id="reset" title="回到开局" aria-label="回到开局">↶</button><button class="step" id="prev" title="上一步（左箭头）" aria-label="上一步">‹</button><button class="play" id="play">▶ 播放</button><button class="step" id="next" title="下一步（右箭头）" aria-label="下一步">›</button><button class="step" id="end" title="查看结果" aria-label="查看结果">⇥</button></div><div class="control-right"><div class="phase-toggle"><button id="before">行动前</button><button id="after" class="chosen">行动后</button></div><label>速度 <select id="speed" aria-label="播放速度"><option value="1800">0.7×</option><option value="1200" selected>1×</option><option value="650">2×</option><option value="300">4×</option></select></label></div></div>
</div>
</main>
<aside class="side">
 <section class="panel"><div class="panel-label"><span>英雄生命走势</span><span>点按曲线跳转</span></div><svg id="healthChart" class="health-chart" viewBox="0 0 260 84" role="img" aria-label="双方英雄生命变化"></svg><div class="legend"><span><i></i>动物园</span><span><i class="opp"></i>对手</span></div></section>
 <section class="panel"><div class="panel-label">关键时刻</div><div class="chapter-grid" id="chapters"></div></section>
 <section class="panel"><div class="panel-label"><span>当前动作解读</span><span id="actorTag"></span></div><div class="note" id="note"></div></section>
 <section class="panel"><div class="panel-label"><span>动作时间线</span><span>点击任意动作</span></div><div class="log" id="log"></div></section>
 <section class="panel"><div class="panel-label">本局看点</div><ul class="recap" id="recap"></ul></section>
</aside>
</div>
<footer><span id="provenance"></span><span class="hide-mobile">← / → 逐步 · 空格播放 · 支持离线打开</span><button class="link-button" id="download">下载回放数据 ↓</button></footer>
</div>
<script type="application/json" id="replayData">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('replayData').textContent),F=D.frames,$=id=>document.getElementById(id);
let index=Math.max(0,Math.min(F.length-1,Number(new URLSearchParams(location.search).get('frame'))||0)),timer=null,before=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cnClass={WARLOCK:'术士',PALADIN:'圣骑士',PRIEST:'牧师'};
const symbols={EX1_586:'♜',EX1_556:'⚙',EX1_008:'✧',EX1_067:'✦',EX1_093:'♜',NEW1_019:'✣',CS2_065:'◈',EX1_319:'♨',EX1_162:'♞',EX1_032:'☀',CS2_182:'♟',EX1_091:'✺'};
const keyword=c=>[['taunt','嘲讽'],['divine_shield','圣盾'],['deathrattle','亡语'],['windfury','风怒'],['poisonous','剧毒'],['frozen','冻结'],['stealth','潜行'],['silenced','沉默']].filter(([k])=>c[k]).map(x=>x[1]).join(' · ');
function hero(p,own){const h=p.hero;return `<div class="portrait">${own?'☽':h.hero_class==='PALADIN'?'☀':'✧'}</div><div><div class="hero-title">${own?'动物园 v7':esc(D.opponent)} <span class="role">${esc(h.zh)} · ${cnClass[h.hero_class]||h.hero_class}</span></div><div class="hero-health"><span class="hp-number" title="实际生命 ${h.health}">${Math.max(0,h.health)}<small> / 30</small></span><div class="hp-track"><i style="width:${Math.max(0,Math.min(100,h.health/30*100))}%"></i></div>${h.armor?`<span class="armor">◈ ${h.armor} 护甲</span>`:''}</div></div><div class="mana-info"><span class="mana-number">${p.mana} / ${p.max_mana} 法力</span><div class="crystals">${Array.from({length:p.max_mana},(_,i)=>`<i class="crystal ${i>=p.mana?'spent':''}"></i>`).join('')}</div><div class="tiny">牌库 ${p.deck_remaining}${p.weapon?` · 武器 ${p.weapon.attack}/${p.weapon.durability}`:''}${p.secrets?` · 奥秘 ${p.secrets}`:''}</div></div>`;}
function minion(c,enemy,frame){const tags=keyword(c),tip=`${c.zh} (${c.name})\n攻击 ${c.attack} / 生命 ${c.health}\n${tags}\n${c.text||''}`;return `<div class="minion ${enemy?'enemy':''} ${c.taunt?'taunt':''} ${c.divine_shield?'shield':''} ${c.can_attack?'ready':''} ${c.entity_id===frame.source?'source':''} ${c.entity_id===frame.target?'target':''} ${c.card_id==='EX1_586'?'giant':''}" data-entity="${c.entity_id}" title="${esc(tip)}">${c.can_attack?'<span class="ready-dot">●</span>':''}<div class="sigil">${symbols[c.card_id]||'♟'}</div><div class="minion-name">${esc(c.zh)}</div><div class="minion-tags">${esc(tags)}</div><div class="stats"><span class="stat atk">${c.attack}</span><span class="stat life">${c.health}</span></div></div>`;}
function handCard(c){return `<div class="hand-card ${c.type==='SPELL'?'spell':''} ${c.playable?'playable':''}" title="${esc(c.zh+' ('+c.name+')\n'+(c.text||''))}"><span class="cost">${c.cost}</span><div class="hand-name">${esc(c.zh)}</div><div class="hand-stats">${c.type==='MINION'?`${c.attack} ⚔ ${c.health} ♥`:'法术'}</div></div>`;}
function chart(){let parts=['<line x1="12" x2="252" y1="6" y2="6" stroke="#3c4553" stroke-dasharray="3 4"/><line x1="12" x2="252" y1="70" y2="70" stroke="#3c4553"/>'];for(const [side,color]of [['you','#8cd5b3'],['opponent','#efc77d']]){const pts=F.map((f,i)=>`${12+i/(F.length-1)*240},${70-Math.max(0,f.state[side].hero.health)/30*64}`).join(' ');parts.push(`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`);}const x=12+index/(F.length-1)*240;parts.push(`<line x1="${x}" x2="${x}" y1="2" y2="76" stroke="#d9e3f1" opacity=".7"/><text x="1" y="11" fill="#8390a4" font-size="8">30</text><text x="3" y="73" fill="#8390a4" font-size="8">0</text>`);$('healthChart').innerHTML=parts.join('');}
function render(){const f=F[index],s=(before&&index>0?F[index-1]:f).state;const over=s.phase==='game_over';$('oppHero').innerHTML=hero(s.opponent,false);$('ownHero').innerHTML=hero(s.you,true);$('oppHero').classList.toggle('selected-hero',s.opponent.hero.entity_id===f.target);$('ownHero').classList.toggle('selected-hero',s.you.hero.entity_id===f.target);$('opponentBoard').innerHTML=s.opponent.board.map(c=>minion(c,true,f)).join('')||'<span class="empty-board">对方场上暂无随从</span>';$('ownBoard').innerHTML=s.you.board.map(c=>minion(c,false,f)).join('')||'<span class="empty-board">我方场上暂无随从</span>';$('ownHand').innerHTML=s.you.hand.map(handCard).join('')||'<div class="hand-empty">手牌已空</div>';$('handCount').textContent=s.you.hand.length+' 张';$('opponentHand').innerHTML=Array.from({length:s.opponent.hand_size},()=>'<i class="cardback"></i>').join('')+`<span style="margin-left:8px">对手手牌 ${s.opponent.hand_size} 张 · 内容隐藏</span>`;$('turnLabel').textContent=s.turn?`第 ${Math.ceil(s.turn/2)} 轮 · T${s.turn}`:'起手换牌';$('activeLabel').textContent=over?'对局结束':s.turn===0?'准备阶段':s.active===D.seat?'我方行动':'对手行动';$('activeLabel').classList.toggle('enemy',s.active!==D.seat&&!over);$('viewBadge').textContent=before?'行动前':'行动后';$('actionText').textContent=f.label;$('actionSub').textContent=index===0?'点击播放完整对局；点击右侧关键时刻可直接跳转。':`${f.actor===D.seat?'动物园':'对手'} · 动作 ${index} / ${F.length-1} · ${before?'当前展示结算前场面':'当前展示结算后场面'}`;$('actionIcon').textContent=({attack:'⚔',play_card:'▱',hero_power:'✧',end_turn:'↪',mulligan:'↻',start:'▷'})[f.kind]||'◇';$('actorTag').textContent=f.actor===null?'':f.actor===D.seat?'我方':'对手';$('note').textContent=f.note||f.details.slice(0,3).join('；')||'本动作已完成。继续播放以观察场面变化。';$('seek').value=index;$('progressLabel').textContent=`${index} / ${F.length-1} 步`;$('prev').disabled=index===0;$('next').disabled=index===F.length-1;$('before').classList.toggle('chosen',before);$('after').classList.toggle('chosen',!before);$('endRibbon').hidden=!over;$('endRibbon').textContent=D.won?'✓ 动物园获胜':'动物园落败';document.querySelectorAll('.log-item').forEach((el,i)=>el.classList.toggle('selected',i===index));const active=$('log').children[index];if(active){const parent=$('log');if(active.offsetTop<parent.scrollTop||active.offsetTop+active.offsetHeight>parent.scrollTop+parent.clientHeight){parent.scrollTop=active.offsetTop-(parent.clientHeight-active.offsetHeight)/2;}}document.querySelectorAll('.chapter').forEach(b=>b.classList.toggle('current',Number(b.dataset.frame)===index));chart();document.body.dataset.frame=index;document.body.dataset.terminal=String(over);}
function pause(){if(timer){clearInterval(timer);timer=null;}$('play').textContent='▶ 播放';}
function go(n,manual=true){if(manual)pause();index=Math.max(0,Math.min(F.length-1,n));render();if(index===F.length-1)pause();}
function play(){if(timer)return pause();before=false;if(index===F.length-1)index=0;$('play').textContent='Ⅱ 暂停';render();timer=setInterval(()=>go(index+1,false),Number($('speed').value));}
$('play').onclick=play;$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('reset').onclick=()=>{before=false;go(0)};$('end').onclick=()=>{before=false;go(F.length-1)};$('seek').oninput=e=>go(Number(e.target.value));$('before').onclick=()=>{pause();before=true;render()};$('after').onclick=()=>{before=false;render()};$('speed').onchange=()=>{if(timer){pause();play();}};$('healthChart').onclick=e=>{const rect=e.currentTarget.getBoundingClientRect();go(Math.round(Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width))*(F.length-1)));};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','A'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(F.length-1)}});
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download=D.game_id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
document.body.classList.toggle('defeat',!D.won);$(D.won?'navWin':'navLoss').classList.add('active');$('resultTag').textContent=D.won?'✓ 胜利':'× 失败';$('matchTitle').textContent='动物园 vs '+D.opponent;$('subtitle').textContent=D.subtitle;$('roundCount').textContent=D.rounds;$('actionCount').textContent=F.length-1;$('firstLabel').textContent=D.first?'先手':'后手';$('seek').max=F.length-1;$('chapters').innerHTML=D.chapters.map(c=>`<button class="chapter" data-frame="${c.frame}">${esc(c.title)}</button>`).join('');document.querySelectorAll('.chapter').forEach(b=>b.onclick=()=>{before=false;go(Number(b.dataset.frame))});$('log').innerHTML=F.map((f,i)=>`<button class="log-item" data-frame="${i}"><span class="log-turn">${f.turn?'T'+f.turn:'起手'}</span>${esc(f.label)}</button>`).join('');$('log').style.position='relative';document.querySelectorAll('.log-item').forEach(b=>b.onclick=()=>go(Number(b.dataset.frame)));$('recap').innerHTML=D.recap.map(t=>`<li>${esc(t)}</li>`).join('');$('provenance').textContent=`真实引擎回放 · Seed ${D.seed} · 我方 P${D.seat} · ${D.validation.observations_checked} 个动作逐一校验`;
window.REPLAY={data:D,go,render,get index(){return index},pause};render();
</script>
</body></html>
